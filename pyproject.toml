[project]
name = "doc-pipeline"
version = "0.1.0"
description = "Document intelligence pipeline: scanned PDF → structured data."
requires-python = ">=3.11"
dependencies = [
    # Web / config
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Object storage
    "aioboto3>=12.3",
    # Logging
    "structlog>=24.1",
    # Graph
    "neo4j>=5.18",
    # OCR + image
    "pytesseract>=0.3.10",
    "pymupdf>=1.23",
    "pdf2image>=1.17",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "scikit-image>=0.22",
    # Cloud OCR
    "openai>=1.0",
    # Matching + NLP
    "rapidfuzz>=3.6",
    "spacy>=3.7",
    # Reference data
    "pandas>=2.2",
    "openpyxl>=3.1",
    # Dashboard
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4",
]

[project.optional-dependencies]
ml = [
    # Embeddings — pulls torch (~2 GB). Only needed in persist + index stages.
    "sentence-transformers>=2.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.9",
    "moto[s3]>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Start loose; tighten when stages stabilize.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires running services (run with `make test-integration`)",
    "openrouter: requires an OpenRouter API key (OPENROUTER_API_KEY set)",
    "benchmark: retrieval quality benchmarks — opt-in only, requires indexed data",
]
