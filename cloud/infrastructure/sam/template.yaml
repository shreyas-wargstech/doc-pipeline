AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  DocIntel — Zero Docker, Full AWS Managed Services.
  Production infrastructure: S3, SQS, RDS, ElastiCache, Lambda, ECS Fargate,
  CloudWatch, Secrets Manager. One-command deploy. One-command teardown.

# ────────────────────────────────────────────────────────────────────────────
# Parameters
# ────────────────────────────────────────────────────────────────────────────

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
    Description: Deployment environment name.

  Region:
    Type: String
    Default: ap-south-1
    Description: AWS region. Mumbai (ap-south-1) is recommended for India.

  RdsInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium, db.t3.large]
    Description: RDS instance class. Start with db.t3.medium; scale up as needed.

  RdsAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: RDS allocated storage in GB. Auto-scales up to 100 GB.

  EnableMultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable Multi-AZ for RDS (adds cost, provides HA). Set to 'true' for production.

  RdsEndpointAddress:
    Type: String
    Description: >-
      Endpoint address of the externally-managed RDS instance (not created by
      this stack — provisioned manually, e.g. docintel-production-postgres-public).

  RdsInstanceIdentifier:
    Type: String
    Default: ''
    Description: >-
      DBInstanceIdentifier of the externally-managed RDS instance, used only
      for the CloudWatch dashboard widget dimension. Optional.

  EcsTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Number of ECS Fargate tasks for the API server. Auto-scaling configured separately.

  EcsCpu:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048]
    Description: ECS task CPU units (256 = 0.25 vCPU, 512 = 0.5 vCPU).

  EcsMemory:
    Type: Number
    Default: 1024
    AllowedValues: [512, 1024, 2048, 4096]
    Description: ECS task memory in MB.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for RDS, ElastiCache, and ECS. Use default VPC or create one.

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 1 for RDS and ElastiCache.

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet 2 for RDS and ElastiCache (different AZ from subnet 1).

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 1 for ECS ALB.

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet 2 for ECS ALB.

  S3BucketName:
    Type: String
    Default: ''
    Description: >
      S3 bucket name for document storage. Leave blank for auto-generated name.
      Must be globally unique. If blank, generates docintel-documents-{account}-{env}.

  OpenRouterApiKey:
    Type: String
    Description: OpenRouter API key for VLM tier.
    NoEcho: true

  OpenRouterBaseUrl:
    Type: String
    Default: https://openrouter.ai/api/v1
    Description: OpenRouter base URL.

  OpenRouterModel:
    Type: String
    Default: google/gemini-2.5-flash
    Description: OpenRouter model ID for VLM.

  OpenRouterTextModel:
    Type: String
    Default: openrouter/free
    Description: >-
      OpenRouter model ID for text-only LLM calls (classifier + structure
      extraction). The free tier is intentional here for cost — text jobs
      tolerate its latency now that StructureFunction Timeout is 120s (the real
      fix for the structure stall; FIX-075). `google/gemini-2.5-flash` is
      reserved for the VLM (OpenRouterModel) only.

  DashboardSessionSecret:
    Type: String
    Description: HMAC secret for dashboard signed-cookie sessions.
    NoEcho: true

  QdrantUrl:
    Type: String
    Description: Qdrant Cloud cluster URL (e.g. https://xyz.aws.cloud.qdrant.io:6333).

  QdrantApiKey:
    Type: String
    Description: Qdrant Cloud API key (stored in Secrets Manager).
    NoEcho: true

  Neo4jUri:
    Type: String
    Description: Neo4j Aura connection URI (e.g. neo4j+s://xxxx.databases.neo4j.io).

  Neo4jUser:
    Type: String
    Default: neo4j
    Description: Neo4j username.

  Neo4jPassword:
    Type: String
    Description: Neo4j Aura password (stored in Secrets Manager).
    NoEcho: true

  RdsPassword:
    Type: String
    Description: >-
      RDS master password, written verbatim to Secrets Manager as RDS_PASSWORD.
      MUST match the actual RDS instance master password. Supplied as a deploy
      param (not CFN-generated) so the secret is deterministic across deploys —
      see FIX-074 (GenerateSecretString regenerated this on every secret-param
      change and desynced it from RDS). Keep JSON-safe (no " } \ or ${...}).
    NoEcho: true

  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to access the ALB. Restrict to your office IP for production.

  RdsAllowedCidr:
    Type: String
    Default: ''
    Description: >
      CIDR block allowed direct access to RDS on port 5432 (e.g. 203.0.113.5/32).
      Leave blank to disable public ingress (Lambda/ECS access still works via SG rules).

  DBSnapshotIdentifier:
    Type: String
    Default: ''
    Description: >
      RDS snapshot ARN or identifier to restore from when the DB is replaced.
      Required when subnet group changes (public access migration). Leave blank for a fresh DB.

# ────────────────────────────────────────────────────────────────────────────
# Globals
# ────────────────────────────────────────────────────────────────────────────

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Architectures:
      - x86_64
    Environment:
      Variables:
        # NOTE: AWS_REGION is a Lambda-reserved key and is auto-injected by the
        # runtime (set to the function's own region) — setting it explicitly is
        # rejected at create time. shared/config.py reads it from the runtime env.
        ENVIRONMENT: !Ref Environment
        SECRETS_MANAGER_ARN: !Ref DocIntelSecrets
        S3_BUCKET: !Ref DocumentsBucket
        SQS_OCR_QUEUE_URL: !Ref OcrQueue
        SQS_STRUCTURE_QUEUE_URL: !Ref StructureQueue
        SQS_MATCH_QUEUE_URL: !Ref MatchQueue
        SQS_PERSIST_QUEUE_URL: !Ref PersistQueue
        SQS_INDEX_QUEUE_URL: !Ref IndexQueue
        RDS_HOST: !Ref RdsEndpointAddress
        RDS_PORT: '5432'
        RDS_DATABASE: 'doc_pipeline'
        RDS_USERNAME: 'pipeline'
        REDIS_HOST: !GetAtt RedisCluster.RedisEndpoint.Address
        REDIS_PORT: '6379'
        OPENROUTER_BASE_URL: !Ref OpenRouterBaseUrl
        OPENROUTER_MODEL: !Ref OpenRouterModel
        OPENROUTER_TEXT_MODEL: !Ref OpenRouterTextModel
        QDRANT_URL: !Ref QdrantUrl
        NEO4J_URI: !Ref Neo4jUri
        NEO4J_USER: !Ref Neo4jUser
        # Sourced directly from deploy parameters (fresh each deploy). config.py
        # reads these as plain env vars; only RDS_PASSWORD is fetched from Secrets
        # Manager at runtime. DocIntelSecrets is now a deterministic SecretString
        # built from the same params (see FIX-074), so env and secret stay in sync.
        OPENROUTER_API_KEY: !Ref OpenRouterApiKey
        QDRANT_API_KEY: !Ref QdrantApiKey
        NEO4J_PASSWORD: !Ref Neo4jPassword
    # NOTE: Functions are intentionally NOT in the VPC. A VPC Lambda has no
    # internet without a NAT Gateway / interface endpoints, and the pipeline
    # calls external SaaS (OpenRouter, Qdrant, Neo4j) + AWS APIs (Secrets
    # Manager, SQS). Outside the VPC they get free public egress and reach RDS
    # via its public endpoint. See FIX-071 in documentation/error_fixes.md.
    Tracing: Active

# ────────────────────────────────────────────────────────────────────────────
# Conditions
# ────────────────────────────────────────────────────────────────────────────

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  CustomBucketName: !Not [!Equals [!Ref S3BucketName, '']]
  EnableMultiAzCondition: !Equals [!Ref EnableMultiAz, 'true']
  HasRdsPublicCidr: !Not [!Equals [!Ref RdsAllowedCidr, '']]
  HasDBSnapshot: !Not [!Equals [!Ref DBSnapshotIdentifier, '']]

# ────────────────────────────────────────────────────────────────────────────
# Resources
# ────────────────────────────────────────────────────────────────────────────

Resources:

  # ─────────────────────────────────────────────────────────────────────────
  # SECRETS MANAGER
  # ─────────────────────────────────────────────────────────────────────────

  DocIntelSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub docintel/${Environment}/credentials
      Description: All credentials for DocIntel pipeline and services
      # Deterministic SecretString built entirely from deploy params — NOT
      # GenerateSecretString. The old GenerateStringKey: RDS_PASSWORD generated a
      # fresh random password whenever any embedded param changed, desyncing it
      # from the RDS master and breaking auth on the next deploy (FIX-074).
      # RDS_PASSWORD now comes from the RdsPassword param, so every deploy writes
      # the same known-good value.
      SecretString: !Sub |
        {
          "RDS_PASSWORD": "${RdsPassword}",
          "OPENROUTER_API_KEY": "${OpenRouterApiKey}",
          "DASHBOARD_SESSION_SECRET": "${DashboardSessionSecret}",
          "QDRANT_API_KEY": "${QdrantApiKey}",
          "NEO4J_PASSWORD": "${Neo4jPassword}"
        }
      KmsKeyId: !Ref SecretsKmsKey

  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting DocIntel secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'

  SecretsKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/docintel-${Environment}-secrets
      TargetKeyId: !Ref SecretsKmsKey

  # ─────────────────────────────────────────────────────────────────────────
  # SECURITY GROUPS
  # ─────────────────────────────────────────────────────────────────────────

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub docintel-${Environment}-rds-sg
      GroupDescription: Security group for DocIntel RDS PostgreSQL
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsSecurityGroup
        - !If
          - HasRdsPublicCidr
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref RdsAllowedCidr
            Description: Direct public access from allowed CIDR
          - !Ref AWS::NoValue

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub docintel-${Environment}-redis-sg
      GroupDescription: Security group for DocIntel ElastiCache Redis
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref EcsSecurityGroup

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub docintel-${Environment}-lambda-sg
      GroupDescription: Security group for DocIntel Lambda functions
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub docintel-${Environment}-ecs-sg
      GroupDescription: Security group for DocIntel ECS Fargate tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub docintel-${Environment}-alb-sg
      GroupDescription: Security group for DocIntel Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr

  # ─────────────────────────────────────────────────────────────────────────
  # S3 BUCKET — Document Storage
  # ─────────────────────────────────────────────────────────────────────────

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - CustomBucketName
        - !Ref S3BucketName
        - !Sub docintel-documents-${AWS::AccountId}-${Environment}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToInfrequentAccess
            Status: Enabled
            Transition:
              TransitionInDays: 30
              StorageClass: STANDARD_IA
          - Id: ArchiveToGlacier
            Status: Enabled
            Transition:
              TransitionInDays: 365
              StorageClass: GLACIER

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub arn:aws:s3:::${DocumentsBucket}
              - !Sub arn:aws:s3:::${DocumentsBucket}/*
            Condition:
              Bool:
                'aws:SecureTransport': false

  # ─────────────────────────────────────────────────────────────────────────
  # SQS QUEUES — FIFO with Dead-Letter Queues
  # ─────────────────────────────────────────────────────────────────────────

  # Dead-Letter Queues
  OcrDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-ocr-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days

  StructureDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-structure-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  MatchDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-match-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  PersistDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-persist-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  IndexDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-index-dlq.fifo
      FifoQueue: true
      MessageRetentionPeriod: 1209600

  # Main Queues
  OcrQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-ocr-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      # Must be >= the OcrFunction timeout (300s); AWS recommends 6x. The OCR
      # tier ladder (tesseract + VLM/OpenRouter escalation) is the slowest stage.
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OcrDeadLetterQueue.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: !Ref SecretsKmsKey

  StructureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-structure-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 120
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StructureDeadLetterQueue.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: !Ref SecretsKmsKey

  MatchQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-match-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 120
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MatchDeadLetterQueue.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: !Ref SecretsKmsKey

  PersistQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-persist-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      # >= PersistFunction timeout (300s)
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PersistDeadLetterQueue.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: !Ref SecretsKmsKey

  IndexQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub docintel-${Environment}-index-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      # >= IndexFunction timeout (300s)
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 1209600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt IndexDeadLetterQueue.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: !Ref SecretsKmsKey

  # ─────────────────────────────────────────────────────────────────────────
  # RDS — PostgreSQL 16 is provisioned and managed OUTSIDE this stack
  # (docintel-production-postgres-public, created manually via AWS CLI).
  # See RdsEndpointAddress parameter for the wiring into Lambda/ECS env vars.
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  # ELASTICACHE — Redis
  # ─────────────────────────────────────────────────────────────────────────

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnets for DocIntel ElastiCache Redis
      CacheSubnetGroupName: !Sub docintel-${Environment}-cache-subnet-group
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      CacheNodeType: cache.t3.micro
      Engine: redis
      EngineVersion: '7.1'
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      VpcSecurityGroupIds:
        - !Ref RedisSecurityGroup
      PreferredMaintenanceWindow: sun:03:00-sun:04:00
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: DocIntel

  # ─────────────────────────────────────────────────────────────────────────
  # IAM — Roles & Policies
  # ─────────────────────────────────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub docintel-${Environment}-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DocIntelLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DocumentsBucket}
                  - !Sub arn:aws:s3:::${DocumentsBucket}/*
              - Sid: SQSAccess
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:SendMessage
                Resource:
                  - !GetAtt OcrQueue.Arn
                  - !GetAtt StructureQueue.Arn
                  - !GetAtt MatchQueue.Arn
                  - !GetAtt PersistQueue.Arn
                  - !GetAtt IndexQueue.Arn
                  - !GetAtt OcrDeadLetterQueue.Arn
                  - !GetAtt StructureDeadLetterQueue.Arn
                  - !GetAtt MatchDeadLetterQueue.Arn
                  - !GetAtt PersistDeadLetterQueue.Arn
                  - !GetAtt IndexDeadLetterQueue.Arn
              - Sid: SecretsManagerAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref DocIntelSecrets
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/docintel-${Environment}-*:*
              - Sid: XRayAccess
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt SecretsKmsKey.Arn
              - Sid: RDSConnect
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: '*'
              - Sid: ElastiCacheConnect
                Effect: Allow
                Action:
                  - elasticache:DescribeCacheClusters
                Resource: '*'

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub docintel-${Environment}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: EcsSecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DocIntelSecrets
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !GetAtt SecretsKmsKey.Arn

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub docintel-${Environment}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DocIntelEcsTaskPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${DocumentsBucket}
                  - !Sub arn:aws:s3:::${DocumentsBucket}/*
              - Sid: SQSAccess
                Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt OcrQueue.Arn
                  - !GetAtt StructureQueue.Arn
                  - !GetAtt MatchQueue.Arn
                  - !GetAtt PersistQueue.Arn
                  - !GetAtt IndexQueue.Arn
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DocIntelSecrets
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt SecretsKmsKey.Arn
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ecs/docintel-${Environment}:*
              - Sid: XRayAccess
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'

  # ─────────────────────────────────────────────────────────────────────────
  # LAMBDA FUNCTIONS — Stage Workers (Stubs for Phase 0)
  # ─────────────────────────────────────────────────────────────────────────

  # Note: CodeUri points to the repo root so all shared/ and cloud/
  # modules are packaged. Handler references the production consumer
  # handler in each stage module.

  OcrFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.ocr
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.ocr.consumer.handler"]
      MemorySize: 1024
      # 300s: a page can hit tesseract (~12s) AND escalate to the VLM tier
      # (OpenRouter, tens of seconds). BatchSize 1 so one slow/failing page
      # can't blow the whole batch past the timeout (the consumer has no
      # mid-batch checkpoint — it processes the batch then returns failures).
      Timeout: 300
      Events:
        SQSJob:
          Type: SQS
          Properties:
            Queue: !GetAtt OcrQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      # Reserved concurrency caps (not throughput guarantees). Sum must stay
      # under account_limit(400) − 100 unreserved floor. Total here = 135.
      ReservedConcurrentExecutions: 40

  VlmFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.ocr
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.lambda.vlm.handler.lambda_handler"]
      MemorySize: 2048
      Timeout: 120
      ReservedConcurrentExecutions: 15
      # Invoked by OCR function, not by SQS directly
      Events: {}

  StructureFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.light
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.structure.consumer.handler"]
      MemorySize: 512
      # 30s was too tight for the per-page structure LLM call and dead-lettered
      # the stage on slow responses (FIX: structure stall). Stay <= the
      # StructureQueue VisibilityTimeout (120s) so SQS doesn't redeliver a
      # still-running message.
      Timeout: 120
      Events:
        SQSJob:
          Type: SQS
          Properties:
            Queue: !GetAtt StructureQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      ReservedConcurrentExecutions: 20

  MatchFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.light
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.match.consumer.handler"]
      MemorySize: 256
      Timeout: 15
      Events:
        SQSJob:
          Type: SQS
          Properties:
            Queue: !GetAtt MatchQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
      ReservedConcurrentExecutions: 20

  PersistFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.persist-index
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.persist.consumer.handler"]
      # Bakes the sentence-transformers embedding model (torch). 512 MB OOM'd
      # (Max Memory Used 509/512) and throttled CPU → 30s timeouts. 2048 MB
      # gives model headroom + ~4x CPU; 300s covers embed + Qdrant + Neo4j.
      MemorySize: 2048
      Timeout: 300
      Events:
        SQSJob:
          Type: SQS
          Properties:
            Queue: !GetAtt PersistQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      ReservedConcurrentExecutions: 20

  IndexFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.persist-index
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.index.consumer.handler"]
      # Same persist-index image (embedding model + torch) → same sizing as
      # PersistFunction. 512 MB/30s was too small; 2048 MB/300s for embed+Qdrant.
      MemorySize: 2048
      Timeout: 300
      Events:
        SQSJob:
          Type: SQS
          Properties:
            Queue: !GetAtt IndexQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
      ReservedConcurrentExecutions: 20

  MonitorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.light
      DockerContext: ../../..
    Properties:
      FunctionName: !Sub docintel-${Environment}-monitor
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.lambda.monitor.handler.lambda_handler"]
      MemorySize: 256
      Timeout: 30
      Events:
        MonitorSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          MONITOR_ENABLED: "true"

  # Fan-in sweeper: the per-page OCR fan-out has no single invocation that owns
  # a document, so "all pages OCR'd" is detected by this scheduled poll, which
  # latches the doc processing→structuring and enqueues the Structure stage.
  # Downstream stages (Structure→Match→Persist→Index) chain inline, so this is
  # the only cross-stage trigger that needs a schedule. rate(1 minute) keeps
  # happy-path latency low; the MonitorFunction (>10min) is the stuck fallback.
  SweeperFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: infra/docker/Dockerfile.light
      DockerContext: ../../..
    Properties:
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      ImageConfig:
        Command: ["cloud.orchestration.sweeper.handler"]
      MemorySize: 256
      Timeout: 60
      Events:
        SweepSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
      ReservedConcurrentExecutions: 2

  # ─────────────────────────────────────────────────────────────────────────
  # ECR — API Docker Image Repository
  # ─────────────────────────────────────────────────────────────────────────
  # NOTE: the ECR repo is intentionally NOT managed by this stack. CloudFormation
  # cannot push an image *during* a deploy, so an in-template repo guarantees the
  # ECS service tries to pull a non-existent image on first create → hang/fail.
  # deploy.py creates the repo (idempotent) and pushes the image BEFORE this stack
  # deploys, so the ECS service pulls successfully on its first attempt. The task
  # definition references the image by its computed URI string (AccountId/Region/
  # docintel-${Environment}-api:latest), not by !Ref to a repo resource.

  # ─────────────────────────────────────────────────────────────────────────
  # ECS — API Server (FastAPI + WebSocket)
  # ─────────────────────────────────────────────────────────────────────────

  ApiCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub docintel-${Environment}-api-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 3
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: DocIntel

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub docintel-${Environment}-api
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref EcsCpu
      Memory: !Ref EcsMemory
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/docintel-${Environment}-api:latest
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: DATABASE_URL
              Value: !Sub postgresql+asyncpg://pipeline:{{resolve:secretsmanager:${DocIntelSecrets}:SecretString:RDS_PASSWORD}}@${RdsEndpointAddress}:5432/doc_pipeline
            - Name: S3_BUCKET
              Value: !Ref DocumentsBucket
            - Name: SQS_OCR_QUEUE_URL
              Value: !Ref OcrQueue
            - Name: SQS_STRUCTURE_QUEUE_URL
              Value: !Ref StructureQueue
            - Name: SQS_MATCH_QUEUE_URL
              Value: !Ref MatchQueue
            - Name: SQS_PERSIST_QUEUE_URL
              Value: !Ref PersistQueue
            - Name: SQS_INDEX_QUEUE_URL
              Value: !Ref IndexQueue
            - Name: REDIS_HOST
              Value: !GetAtt RedisCluster.RedisEndpoint.Address
            - Name: OPENROUTER_BASE_URL
              Value: !Ref OpenRouterBaseUrl
            - Name: OPENROUTER_MODEL
              Value: !Ref OpenRouterModel
            - Name: SECRETS_MANAGER_ARN
              Value: !Ref DocIntelSecrets
            - Name: QDRANT_URL
              Value: !Ref QdrantUrl
            - Name: NEO4J_URI
              Value: !Ref Neo4jUri
            - Name: NEO4J_USER
              Value: !Ref Neo4jUser
          Secrets:
            - Name: OPENROUTER_API_KEY
              ValueFrom: !Sub '${DocIntelSecrets}:OPENROUTER_API_KEY::'
            - Name: DASHBOARD_SESSION_SECRET
              ValueFrom: !Sub '${DocIntelSecrets}:DASHBOARD_SESSION_SECRET::'
            - Name: QDRANT_API_KEY
              ValueFrom: !Sub '${DocIntelSecrets}:QDRANT_API_KEY::'
            - Name: NEO4J_PASSWORD
              ValueFrom: !Sub '${DocIntelSecrets}:NEO4J_PASSWORD::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ecs/docintel-${Environment}-api
      RetentionInDays: 30

  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ApiListenerRule
    Properties:
      ServiceName: !Sub docintel-${Environment}-api
      Cluster: !Ref ApiCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref EcsTaskCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref EcsSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      PropagateTags: SERVICE
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: DocIntel

  # ─────────────────────────────────────────────────────────────────────────
  # APPLICATION LOAD BALANCER
  # ─────────────────────────────────────────────────────────────────────────

  ApiAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub docintel-${Environment}-api-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: DocIntel

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub docintel-${Environment}-api-tg
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApiAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ApiListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ['/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # ─────────────────────────────────────────────────────────────────────────
  # CLOUDWATCH — Dashboard & Alarms
  # ─────────────────────────────────────────────────────────────────────────

  PipelineDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub DocIntel-${Environment}-Pipeline
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "OCR Lambda Invocations",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${OcrFunction}", { "stat": "Sum" } ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "VLM Lambda Invocations",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${VlmFunction}", { "stat": "Sum" } ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "SQS Queue Depth (Approximate Messages Visible)",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "docintel-${Environment}-ocr-queue.fifo" ],
                  [ "...", "docintel-${Environment}-structure-queue.fifo" ],
                  [ "...", "docintel-${Environment}-match-queue.fifo" ],
                  [ "...", "docintel-${Environment}-persist-queue.fifo" ],
                  [ "...", "docintel-${Environment}-index-queue.fifo" ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Error Rate",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${OcrFunction}", { "stat": "Sum" } ],
                  [ "...", "${StructureFunction}" ],
                  [ "...", "${MatchFunction}" ],
                  [ "...", "${PersistFunction}" ],
                  [ "...", "${IndexFunction}" ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "RDS CPU Utilization",
                "metrics": [
                  [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "docintel-${Environment}-postgres" ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "ECS API Task Count",
                "metrics": [
                  [ "AWS/ECS", "RunningTaskCount", "ServiceName", "docintel-${Environment}-api", "ClusterName", "docintel-${Environment}-api-cluster" ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Request Count",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ApiAlb.LoadBalancerFullName}" ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "ALB 5xx Error Rate",
                "metrics": [
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${ApiAlb.LoadBalancerFullName}" ]
                ],
                "period": 60,
                "region": "${AWS::Region}",
                "yAxis": { "left": { "min": 0 } }
              }
            }
          ]
        }

  # ── CloudWatch Alarms ──

  OcrQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub DocIntel-${Environment}-OCR-Queue-Depth-High
      AlarmDescription: Alert when OCR queue depth exceeds 100 messages for > 10 minutes
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OcrQueue.QueueName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertSnsTopic

  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub DocIntel-${Environment}-Lambda-Error-Rate-High
      AlarmDescription: Alert when Lambda error rate exceeds 5% for any function
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertSnsTopic

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub DocIntel-${Environment}-RDS-CPU-High
      AlarmDescription: Alert when RDS CPU exceeds 80% for > 5 minutes
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RdsInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertSnsTopic

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub DocIntel-${Environment}-ALB-5xx-Errors
      AlarmDescription: Alert when ALB 5xx errors exceed 10 in 5 minutes
      MetricName: HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApiAlb.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertSnsTopic

  AlertSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub docintel-${Environment}-alerts
      DisplayName: DocIntel Alerts

# ────────────────────────────────────────────────────────────────────────────
# Outputs
# ────────────────────────────────────────────────────────────────────────────

Outputs:
  ApiEndpoint:
    Description: Application Load Balancer DNS name (API endpoint)
    Value: !GetAtt ApiAlb.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  S3Bucket:
    Description: Document storage bucket name
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub ${AWS::StackName}-S3Bucket

  RdsEndpoint:
    Description: RDS PostgreSQL endpoint (externally-managed instance)
    Value: !Ref RdsEndpointAddress
    Export:
      Name: !Sub ${AWS::StackName}-RdsEndpoint

  RdsPort:
    Description: RDS PostgreSQL port
    Value: '5432'
    Export:
      Name: !Sub ${AWS::StackName}-RdsPort

  RedisEndpoint:
    Description: ElastiCache Redis endpoint
    Value: !GetAtt RedisCluster.RedisEndpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-RedisEndpoint

  RedisPort:
    Description: ElastiCache Redis port
    Value: !GetAtt RedisCluster.RedisEndpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-RedisPort

  OcrQueueUrl:
    Description: SQS OCR queue URL
    Value: !Ref OcrQueue
    Export:
      Name: !Sub ${AWS::StackName}-OcrQueueUrl

  StructureQueueUrl:
    Description: SQS Structure queue URL
    Value: !Ref StructureQueue
    Export:
      Name: !Sub ${AWS::StackName}-StructureQueueUrl

  MatchQueueUrl:
    Description: SQS Match queue URL
    Value: !Ref MatchQueue
    Export:
      Name: !Sub ${AWS::StackName}-MatchQueueUrl

  PersistQueueUrl:
    Description: SQS Persist queue URL
    Value: !Ref PersistQueue
    Export:
      Name: !Sub ${AWS::StackName}-PersistQueueUrl

  IndexQueueUrl:
    Description: SQS Index queue URL
    Value: !Ref IndexQueue
    Export:
      Name: !Sub ${AWS::StackName}-IndexQueueUrl

  SecretsArn:
    Description: Secrets Manager ARN for credentials
    Value: !Ref DocIntelSecrets
    Export:
      Name: !Sub ${AWS::StackName}-SecretsArn

  ApiEcrRepositoryUri:
    Description: ECR repository URI for the API Docker image (repo managed by deploy.py, not this stack)
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/docintel-${Environment}-api
    Export:
      Name: !Sub ${AWS::StackName}-ApiEcrRepositoryUri

  DashboardUrl:
    Description: CloudWatch Dashboard URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${PipelineDashboard}
    Export:
      Name: !Sub ${AWS::StackName}-DashboardUrl
