services:
  postgres:
    image: postgres:16-alpine
    container_name: docpipe-postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: doc_pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d doc_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: docpipe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docpipe-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: docpipe-neo4j
    environment:
      NEO4J_AUTH: neo4j/pipeline-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: docpipe-elasticmq
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    env_file: .env
    environment:
      # Override to the compose service hostnames + the actual postgres creds
      # (postgres container is pipeline/pipeline @ db doc_pipeline — see the
      # postgres service above; NOT the docpipeline/postgres in the plan draft).
      DATABASE_URL: postgresql+asyncpg://pipeline:pipeline@postgres:5432/doc_pipeline
      S3_ENDPOINT_URL: http://minio:9000
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      SQS_ENDPOINT_URL: http://elasticmq:9324
      # .env's queue URL points at localhost:9324 — unreachable inside the
      # network; re-point the host at the elasticmq service.
      SQS_OCR_QUEUE_URL: http://elasticmq:9324/000000000000/ocr-queue.fifo
    ports:
      - "8000:8000"
    depends_on: [postgres, minio, qdrant, neo4j, elasticmq]
    # uv-managed venv → invoke via `uv run` (bare uvicorn isn't on PATH).
    command: uv run uvicorn cloud.app:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on: [api]

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  neo4j_data:
